<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Ke Xueyi - CV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Curriculum Vitae of Xueyi Ke">
    <meta name="keywords" content="Xueyi Ke, CV, Resume, Computer Vision, AI Research, NTU">
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <link rel="canonical" href="https://kexueyi.github.io/cv.html">
    
    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Ke Xueyi - CV">
    <meta property="og:description" content="Curriculum Vitae of Xueyi Ke">
    <meta property="og:url" content="https://kexueyi.github.io/cv.html">
    <meta property="og:type" content="website">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/text.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-primary);
        }

        .cv-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
        }

        .cv-info {
            padding: 6px 0em 6px;
            text-align: center;
            background-color: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* Increased gap between elements */
            border-bottom: 1px solid var(--border-color);
            height: 25px; /* Fixed height for info bar */
        }

        .cv-viewer {
            flex: 1;
            width: 100%;
            height: 120%;
            border: none;
            display: block;
        }

        /* 修改cv-update-date的样式 */
        #cv-update-date {
            color: var(--text-primary);
            font-size: 13px;
            font-family: var(--font-primary); /* 使用主页面的字体 */
        }
    </style>
</head>
<body>
    <div class="cv-container">
        <div class="cv-info">
            <span id="cv-update-date"></span>
        </div>
        <iframe src="documents/CV_Xueyi.pdf" class="cv-viewer"></iframe>
    </div>
    
    <script>
        async function showCVInfo() {
            try {
                const response = await fetch('documents/CV_Xueyi.pdf', { method: 'HEAD' });
                if (!response.ok) throw new Error('CV file not found');
                
                const lastModified = response.headers.get('last-modified');
                const date = new Date(lastModified);
                
                // 使用与主页面相同的日期格式化函数
                const formatDate = (date) => {
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 
                                   'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const day = date.getDate().toString().padStart(2, '0');
                    const month = months[date.getMonth()];
                    const year = date.getFullYear();
                    return `${day}/${month}/${year}`;
                };
                
                document.getElementById('cv-update-date').textContent = 
                    `Last Updated: ${formatDate(date)}`;
                
            } catch (error) {
                console.error('Error fetching CV metadata:', error);
                document.getElementById('cv-update-date').textContent = 
                    'Update date unavailable';
            }
        }
        
        showCVInfo();
    </script>
</body>
</html>
