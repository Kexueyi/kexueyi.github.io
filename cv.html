<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Ke Xueyi - CV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/main.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-primary);
        }

        .cv-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
        }

        .cv-info {
            padding: 6px 0em 6px;
            text-align: center;
            background-color: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* Increased gap between elements */
            border-bottom: 1px solid var(--border-color);
            height: 25px; /* Fixed height for info bar */
        }

        .cv-viewer {
            flex: 1;
            width: 100%;
            height: 120%;
            border: none;
            display: block;
        }

        #cv-update-date {
            color: var(--text-tertiary);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="cv-container">
        <div class="cv-info">
            <span id="cv-update-date"></span>
        </div>
        <iframe src="documents/CV-KeXueyi.pdf" class="cv-viewer"></iframe>
    </div>
    
    <script>
        async function showCVInfo() {
            try {
                const response = await fetch('documents/CV-KeXueyi.pdf', { method: 'HEAD' });
                if (!response.ok) throw new Error('CV file not found');
                
                const lastModified = response.headers.get('last-modified');
                const date = new Date(lastModified);
                
                const formatted = date.toLocaleDateString('en-GB', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });
                
                document.getElementById('cv-update-date').textContent = 
                    `Last Updated: ${formatted}`;
                
            } catch (error) {
                console.error('Error fetching CV metadata:', error);
                document.getElementById('cv-update-date').textContent = 
                    'Update date unavailable';
            }
        }
        
        showCVInfo();
    </script>
</body>
</html>
